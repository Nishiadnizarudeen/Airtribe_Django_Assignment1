services:
  eventhub:
    command:
      [
        "sh",
        "-c",
        "python manage.py migrate --noinput && pip install debugpy -t /tmp && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 manage.py runserver 0.0.0.0:8000 --nothreading --noreload",
      ]
    ports:
      - "5678:5678"
